<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração</title>
<style>
  :root {
    --bg: #f6f7f9; --painel: #ffffff; --borda: #e2e5ea; --texto: #1c1f26; --texto-fraco: #6b7280;
    --azul: #2f5fdb; --azul-escuro: #23459f; --vermelho: #d64545; --vermelho-bg: #fdecec;
    --verde-bg: #e9f7ee; --verde-texto: #1c7a3d; --sombra: 0 1px 3px rgba(16,24,40,.08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--texto); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: var(--painel); border-bottom: 1px solid var(--borda); }
  header h1 { font-size: 17px; margin: 0; }
  #usuarioAtual { font-size: 13px; color: var(--texto-fraco); }
  main { max-width: 880px; margin: 32px auto; padding: 0 16px; }
  .painel { background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; box-shadow: var(--sombra); }
  .login-caixa { max-width: 380px; margin: 80px auto; padding: 32px; }
  .login-caixa h1 { font-size: 19px; margin: 0 0 20px; text-align: center; }
  label { display: block; font-size: 13px; color: var(--texto-fraco); margin: 14px 0 6px; }
  input { width: 100%; padding: 9px 11px; border: 1px solid var(--borda); border-radius: 7px; font-size: 14px; }
  input:focus { outline: 2px solid var(--azul); outline-offset: -1px; }
  button { cursor: pointer; border: none; border-radius: 7px; font-size: 14px; font-weight: 600; padding: 9px 14px; }
  .botao-primario { background: var(--azul); color: #fff; width: 100%; margin-top: 20px; }
  .botao-primario:hover { background: var(--azul-escuro); }
  .botao-secundario { background: #eef0f3; color: var(--texto); }
  .botao-perigo { background: var(--vermelho-bg); color: var(--vermelho); }
  .aviso { background: var(--vermelho-bg); color: var(--vermelho); font-size: 13px; padding: 9px 11px; border-radius: 7px; margin-top: 14px; display: none; }
  .aviso.mostrar { display: block; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--borda); }
  th { font-size: 12px; text-transform: uppercase; color: var(--texto-fraco); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .selo { font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .selo-admin { background: #eef1fd; color: var(--azul-escuro); }
  .selo-usuario { background: #f1f2f4; color: var(--texto-fraco); }
  .selo-verificado { background: var(--verde-bg); color: var(--verde-texto); }
  .selo-pendente { background: #fff4e5; color: #9a6700; }
  .acoes { display: flex; gap: 8px; }
  .acoes button { padding: 6px 10px; font-size: 12px; }
  .barra-topo { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; }
  .barra-topo h2 { font-size: 15px; margin: 0; }
  .vazio { padding: 40px; text-align: center; color: var(--texto-fraco); font-size: 14px; }
  .oculto { display: none; }
  dialog { border: none; border-radius: 10px; padding: 0; box-shadow: 0 8px 24px rgba(16,24,40,.18); width: min(360px, 90vw); }
  dialog::backdrop { background: rgba(16,24,40,.35); }
  .dialogo-corpo { padding: 24px; }
  .dialogo-corpo h3 { margin: 0 0 4px; font-size: 16px; }
  .dialogo-rodape { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; }
</style>
</head>
<body>

<div id="telaLogin" class="login-caixa painel">
  <h1>Painel do administrador</h1>
  <form id="formLogin">
    <label for="loginEmail">E-mail ou login</label>
    <input id="loginEmail" autocomplete="username" required>
    <label for="loginSenha">Senha</label>
    <input id="loginSenha" type="password" autocomplete="current-password" required>
    <button class="botao-primario" type="submit">Entrar</button>
    <div id="loginErro" class="aviso"></div>
  </form>
</div>

<div id="telaPainel" class="oculto">
  <header>
    <h1>Administração</h1>
    <div style="display:flex; align-items:center; gap:16px;">
      <span id="usuarioAtual"></span>
      <button class="botao-secundario" id="botaoSair">Sair</button>
    </div>
  </header>
  <main>
    <div class="painel">
      <div class="barra-topo">
        <h2>Usuários</h2>
        <button class="botao-secundario" id="botaoAtualizar">Atualizar</button>
      </div>
      <div id="areaTabela"></div>
    </div>
  </main>
</div>

<dialog id="dialogoEditar">
  <form class="dialogo-corpo" id="formEditar" method="dialog">
    <h3>Editar usuário</h3>
    <label for="editNome">Nome</label>
    <input id="editNome" required>
    <label for="editEmail">E-mail</label>
    <input id="editEmail" type="email" required>
    <label for="editTelefone">Telefone</label>
    <input id="editTelefone">
    <div id="editErro" class="aviso"></div>
    <div class="dialogo-rodape">
      <button type="button" class="botao-secundario" id="botaoCancelarEdicao">Cancelar</button>
      <button type="submit" class="botao-primario" style="width:auto;">Salvar</button>
    </div>
  </form>
</dialog>

<script>
"use strict";

// Tudo relativo: a página é servida pela própria API, então não há problema de CORS.
async function chamarApi(caminho, opcoes = {}) {
  const resposta = await fetch(caminho, {
    method: opcoes.method || "GET",
    headers: opcoes.corpo ? { "Content-Type": "application/json" } : undefined,
    body: opcoes.corpo ? JSON.stringify(opcoes.corpo) : undefined,
  });
  const tipo = resposta.headers.get("content-type") || "";
  const dados = tipo.includes("application/json") ? await resposta.json().catch(() => ({})) : null;
  if (!resposta.ok) {
    const erro = new Error((dados && dados.erro) || `Erro ${resposta.status}`);
    erro.status = resposta.status;
    erro.detalhes = dados;
    throw erro;
  }
  return dados;
}

const el = (id) => document.getElementById(id);
const escapar = (texto) =>
  String(texto ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function mostrarErro(idAviso, mensagem) {
  const aviso = el(idAviso);
  aviso.textContent = mensagem;
  aviso.classList.add("mostrar");
}
function esconderErro(idAviso) {
  el(idAviso).classList.remove("mostrar");
}

async function verificarSessao() {
  try {
    const { usuario } = await chamarApi("/auth/eu");
    if (usuario.papel !== "admin") {
      mostrarErro("loginErro", "Esta conta não tem acesso de administrador.");
      await chamarApi("/auth/logout", { method: "POST" }).catch(() => {});
      return;
    }
    entrarNoPainel(usuario);
  } catch {
    // sem sessão válida: fica na tela de login
  }
}

function entrarNoPainel(usuario) {
  el("telaLogin").classList.add("oculto");
  el("telaPainel").classList.remove("oculto");
  el("usuarioAtual").textContent = `${usuario.nome} · ${usuario.email}`;
  carregarUsuarios();
}

el("formLogin").addEventListener("submit", async (evento) => {
  evento.preventDefault();
  esconderErro("loginErro");
  const botao = evento.target.querySelector("button");
  botao.disabled = true;
  try {
    const { usuario } = await chamarApi("/auth/login", {
      method: "POST",
      corpo: { email: el("loginEmail").value.trim(), senha: el("loginSenha").value },
    });
    if (usuario.papel !== "admin") {
      mostrarErro("loginErro", "Esta conta não tem acesso de administrador.");
      await chamarApi("/auth/logout", { method: "POST" }).catch(() => {});
      return;
    }
    el("loginSenha").value = "";
    entrarNoPainel(usuario);
  } catch (erro) {
    mostrarErro("loginErro", erro.status === 401 ? "E-mail ou senha inválidos." : erro.message);
  } finally {
    botao.disabled = false;
  }
});

el("botaoSair").addEventListener("click", async () => {
  await chamarApi("/auth/logout", { method: "POST" }).catch(() => {});
  location.reload();
});

el("botaoAtualizar").addEventListener("click", carregarUsuarios);

async function carregarUsuarios() {
  const area = el("areaTabela");
  area.innerHTML = '<div class="vazio">Carregando…</div>';
  try {
    const usuarios = await chamarApi("/usuarios");
    if (!usuarios.length) {
      area.innerHTML = '<div class="vazio">Nenhum usuário cadastrado.</div>';
      return;
    }
    area.innerHTML = `
      <table>
        <thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>E-mail</th><th></th></tr></thead>
        <tbody>${usuarios.map(linhaUsuario).join("")}</tbody>
      </table>`;
  } catch (erro) {
    area.innerHTML = `<div class="vazio">Não foi possível carregar: ${escapar(erro.message)}</div>`;
  }
}

function linhaUsuario(u) {
  const papel = u.papel === "admin"
    ? '<span class="selo selo-admin">Admin</span>'
    : '<span class="selo selo-usuario">Usuário</span>';
  const verificado = u.email_verificado_em
    ? '<span class="selo selo-verificado">Confirmado</span>'
    : '<span class="selo selo-pendente">Pendente</span>';
  return `
    <tr data-id="${u.id}">
      <td>${escapar(u.nome)}</td>
      <td>${escapar(u.email)}</td>
      <td>${papel}</td>
      <td>${verificado}</td>
      <td class="acoes">
        <button class="botao-secundario" onclick="abrirEdicao(${u.id})">Editar</button>
        <button class="botao-perigo" onclick="removerUsuario(${u.id}, '${escapar(u.nome).replace(/'/g, "\\'")}')">Remover</button>
      </td>
    </tr>`;
}

let usuarioEmEdicao = null;

window.abrirEdicao = async function (id) {
  esconderErro("editErro");
  try {
    const u = await chamarApi(`/usuarios/${id}`);
    usuarioEmEdicao = id;
    el("editNome").value = u.nome;
    el("editEmail").value = u.email;
    el("editTelefone").value = u.telefone || "";
    el("dialogoEditar").showModal();
  } catch (erro) {
    alert("Não foi possível abrir: " + erro.message);
  }
};

el("botaoCancelarEdicao").addEventListener("click", () => el("dialogoEditar").close());

el("formEditar").addEventListener("submit", async (evento) => {
  evento.preventDefault();
  esconderErro("editErro");
  try {
    await chamarApi(`/usuarios/${usuarioEmEdicao}`, {
      method: "PUT",
      corpo: {
        nome: el("editNome").value.trim(),
        email: el("editEmail").value.trim(),
        telefone: el("editTelefone").value.trim() || null,
      },
    });
    el("dialogoEditar").close();
    carregarUsuarios();
  } catch (erro) {
    const lista = erro.detalhes && erro.detalhes.erros ? erro.detalhes.erros.join("; ") : erro.message;
    mostrarErro("editErro", lista);
  }
});

window.removerUsuario = async function (id, nome) {
  if (!confirm(`Remover "${nome}"? Essa ação não pode ser desfeita.`)) return;
  try {
    await chamarApi(`/usuarios/${id}`, { method: "DELETE" });
    carregarUsuarios();
  } catch (erro) {
    alert("Não foi possível remover: " + erro.message);
  }
};

verificarSessao();
</script>
</body>
</html>
